<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="友情链接 - 值得关注的博客与站点">
  <meta property="og:title" content="友链">
  <meta property="og:description" content="值得关注的站点与创作者">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230d0d14'/><polygon points='16,6 22,16 16,26 10,16' fill='%235599ee'/></svg>">
  <title>友链 - 博客</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <script src="js/utils.js"></script>
</head>
<body>

  <a href="#main-content" class="skip-link">跳转到主要内容</a>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">BLOG</a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="blog.html">博客</a></li>
        <li><a href="links.html" class="active">友链</a></li>
        <li><a href="about.html">关于</a></li>
      </ul>
      <button class="nav-toggle" id="nav-toggle" aria-label="菜单" aria-expanded="false">
        <span></span>
      </button>
      <span id="theme-toggle-container"></span>
    </div>
  </nav>

  <main id="main-content" class="links-page">
    <header class="links-header">
      <div class="hero-decoration"></div>
      <h1 class="links-title">友链</h1>
      <p class="links-subtitle">值得关注的站点与创作者</p>
    </header>

    <div id="links-grid" class="links-grid">
      <!-- Rendered by JS -->
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-text">
        Built with <span class="footer-accent">◆</span> &
        inspired by Arknights Design Language
      </p>
    </div>
  </footer>

  <script>
    (async () => {
      const grid = document.getElementById('links-grid');
      try {
        const resp = await fetch('data/links.json');
        const data = await resp.json();
        const links = data.links || [];
        if (links.length === 0) {
          grid.innerHTML = '<div class="empty-state"><p class="empty-state-text">暂无友链</p></div>';
          return;
        }
        grid.innerHTML = links.map(l => `
          <a href="${l.url}" target="_blank" rel="noopener noreferrer" class="link-card animate-in">
            <span class="link-card-avatar">${Utils.escapeHtml(l.avatar || l.name[0])}</span>
            <span class="link-card-info">
              <span class="link-card-name">${Utils.escapeHtml(l.name)}</span>
              <span class="link-card-desc">${Utils.escapeHtml(l.description || '')}</span>
            </span>
            <span class="link-card-arrow">→</span>
          </a>
        `).join('');
      } catch (e) {
        grid.innerHTML = '<div class="empty-state"><p class="empty-state-text">暂时还没有友链的说</p></div>';
      }
    })();
  </script>

</body>
</html>
