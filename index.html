<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="个人博客 - 记录技术探索与生活思考">
  <meta property="og:title" content="博客 - 思考与记录">
  <meta property="og:description" content="在代码与文字之间，寻找秩序与美">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230d0d14'/><polygon points='16,6 22,16 16,26 10,16' fill='%235599ee'/></svg>">
  <title>博客 - 思考与记录</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <script src="js/utils.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
          onerror="var s=document.createElement('script');s.src='https://lib.baomitu.com/marked/latest/marked.min.js';s.defer=true;document.head.appendChild(s);"></script>
  <script defer src="js/blog.js"></script>
</head>
<body>

  <!-- Skip link for keyboard users -->
  <a href="#main-content" class="skip-link">跳转到主要内容</a>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="./" class="nav-brand">BLOG</a>
      <ul class="nav-links">
        <li><a href="./" class="active">首页</a></li>
        <li><a href="blog/">博客</a></li>
        <li><a href="links/">友链</a></li>
        <li><a href="about/">关于</a></li>
      </ul>
      <button class="nav-toggle" id="nav-toggle" aria-label="菜单" aria-expanded="false">
        <span></span>
      </button>
      <span id="theme-toggle-container"></span>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero">
    <div class="hero-decoration"></div>
    <h1 class="hero-title">
      思考<span class="hero-title-accent">·</span>记录
    </h1>
    <p class="hero-subtitle">
      在代码与文字之间，寻找秩序与美
    </p>
    <div class="hero-dots">
      <span class="hero-dot"></span>
      <span class="hero-dot"></span>
      <span class="hero-dot"></span>
      <span class="hero-dot"></span>
      <span class="hero-dot"></span>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content">
    <section class="post-list-section">
      <div class="container">
        <div class="section-header">
          <span class="section-header-line"></span>
          <span class="section-header-text">文章列表</span>
          <span class="section-header-line"></span>
        </div>

        <!-- Search -->
        <div class="search-bar">
          <div class="search-wrapper">
            <span class="search-icon">◇</span>
            <label for="search-input" class="sr-only">搜索文章</label>
            <input type="text" id="search-input" class="search-input"
                   placeholder="搜索文章..." aria-label="搜索文章">
          </div>
        </div>

        <!-- Post list rendered by JS -->
        <div id="post-list"></div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-text">
        Built with <span class="footer-accent">◆</span> &
        inspired by Arknights Design Language
      </p>
      <p class="footer-text" style="font-size:0.7rem;">
        &copy; 2026 · 保持思考，保持记录
      </p>
    </div>
  </footer>

</body>
</html>
